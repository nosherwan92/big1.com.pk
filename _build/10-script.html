
<style>
/* ---------- Deferred animation gating (JS adds .hold, then .play) ---------- */
.hold .b.hold .dseg.hold .linechart .line.hold .scanrow.hold .doccard.hold .progress-tiny i{animation-play-state:paused}
.hold.play .b.hold.play .dseg.hold.play .linechart .line.hold.play .scanrow.hold.play .doccard.hold.play .progress-tiny i{animation-play-state:running}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important
  }
  [data-reveal]{opacity:1 !important;transform:none !important}
  .app.tilt{transform:none !important}
  .scanline,.scroll-ind .rail::after{display:none}
}

/* ---------- Print ---------- */
@media print{
  .nav,.scrollbar,.scroll-ind,.cta-sec,.chip{display:none !important}
  body{background:#fff;color:#000}
  .sec{padding-block:24px}
}
/* ---------- Start-your-return chooser ---------- */
.startm{position:fixed;inset:0;z-index:130;display:grid;place-items:end center}
.startm[hidden]{display:none}
.startm-back{position:absolute;inset:0;background:rgba(8,13,19,.55);backdrop-filter:blur(3px);animation:startmFade .25s ease}
@keyframes startmFade{from{opacity:0}}
.startm-dialog{position:relative;width:min(460px,100%);max-height:92vh;overflow:auto;background:var(--bg);
  border:1px solid var(--border);border-radius:22px 22px 0 0;box-shadow:var(--shadow-xl);padding:26px 24px 24px;animation:startmUp .32s var(--ease)}

.startm-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);

.startm-opt .so-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;color:var(--accent);
  background:linear-gradient(135deg,rgba(6,95,70,.12),rgba(16,158,125,.1));border:1px solid var(--border)}
.startm-opt .so-ic svg{width:20px;height:20px}
.startm-opt .so-t{flex:1;min-width:0}
.startm-opt .so-t b{display:block;font-size:.9rem;font-weight:600;letter-spacing:-.01em}

.startm-tiers{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}

.startm-badge.soon{background:var(--text-3)}

@media (max-width:620px){.cookie-in{flex-direction:column;align-items:stretch}.cookie-btns .cookie-btn{flex:1}}
</style>

<script>
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var doc = document.documentElement;

  /* ---------------- Hero story loop (single animated narrative) ---------------- */
  (function heroStory() {
    var root = document.getElementById("heroStory");
    if (!root) return;
    var stepEl = document.getElementById("hsStep");
    var refundEl = document.getElementById("hsRefund");
    var foundEl = document.getElementById("hsFound");
    var readyEl = document.getElementById("hsReady");
    var srcs = [].slice.call(root.querySelectorAll(".hs-src"));
    var chks = [].slice.call(root.querySelectorAll(".hs-chk"));
    var timers = [];
    var TARGET = 41000;

    function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
    function clearAll() { timers.forEach(clearTimeout); timers = []; }

    function reset() {
      srcs.forEach(function (s) { s.classList.remove("lit"); });
      chks.forEach(function (c) { c.classList.remove("show", "done"); });
      root.classList.remove("scanning");
      foundEl.classList.remove("show");
      readyEl.classList.remove("show");
      refundEl.textContent = "Rs 0";
      if (stepEl) stepEl.textContent = "Reading your documents...";
    }

    function countUp(to, ms) {
      if (reduced || ms <= 0) { refundEl.textContent = "Rs " + to.toLocaleString("en-US"); return; }
      // setInterval (not rAF) so the count also completes when the tab is
      // backgrounded; smooth when visible, throttled-but-correct when hidden.
      var startT = +new Date();
      var iv = setInterval(function () {
        var p = Math.min(1, (+new Date() - startT) / ms);
        var eased = 1 - Math.pow(1 - p, 3);
        refundEl.textContent = "Rs " + Math.round(to * eased).toLocaleString("en-US");
        if (p >= 1) clearInterval(iv);
      }, 33);
      timers.push(iv);
    }

    function run() {
      reset();
      if (reduced) {
        srcs.forEach(function (s) { s.classList.add("lit"); });
        foundEl.classList.add("show");
        countUp(TARGET, 0);
        readyEl.classList.add("show");
        chks.forEach(function (c) { c.classList.add("show", "done"); });
        return;
      }
      root.classList.add("scanning");
      srcs.forEach(function (s, i) { at(400 + i * 460, function () { s.classList.add("lit"); }); });
      at(1750, function () { if (stepEl) stepEl.textContent = "Matching withholding..."; });
      at(2200, function () { foundEl.classList.add("show"); });
      at(2700, function () { if (stepEl) stepEl.textContent = "Computing your refund..."; countUp(TARGET, 1500); });
      chks.forEach(function (c, i) {
        at(3100 + i * 420, function () { c.classList.add("show"); });
        at(3300 + i * 420, function () { c.classList.add("done"); });
      });
      at(4700, function () { if (stepEl) stepEl.textContent = "Reconciled, validated"; readyEl.classList.add("show"); });
      at(8200, run); // loop
    }

    // Hero is above the fold, so it always runs. Pause only when the browser
    // tab is hidden (reliable), not via element-level IO (which proved flaky
    // here and could kill the loop's pending timers).
    var running = false;
    function start() { if (running) return; running = true; run(); }
    function stop() { running = false; clearAll(); }
    start();
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop(); else start();
    });
  })();

  /* ---------------- Theme ---------------- */
  var THEME_KEY = "filepak-theme";
  var themeBtn = document.getElementById("themeBtn");
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === "light" || saved === "dark") doc.setAttribute("data-theme", saved);
  } catch (e) {}

  function resolvedTheme() {
    var t = doc.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      var next = resolvedTheme() === "dark" ? "light" : "dark";
      doc.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      themeBtn.setAttribute("aria-label", "Switch to " + (next === "dark" ? "light" : "dark") + " theme");
    });
  }

  /* ---------------- Nav ---------------- */
  var nav = document.getElementById("nav");
  var navToggle = document.getElementById("navToggle");
  var navLinks = document.getElementById("navlinks");
  var bar = document.getElementById("scrollbar");

  if (navToggle && navLinks) {
    navToggle.addEventListener("click", function () {
      var open = navLinks.classList.toggle("open");
      navToggle.setAttribute("aria-expanded", String(open));
    });
    navLinks.addEventListener("click", function (e) {
      if (e.target.tagName === "A") {
        navLinks.classList.remove("open");
        navToggle.setAttribute("aria-expanded", "false");
      }
    });
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var y = window.scrollY || window.pageYOffset;
      if (nav) nav.classList.toggle("stuck", y > 12);
      if (bar) {
        var h = document.body.scrollHeight - window.innerHeight;
        bar.style.width = (h > 0 ? (y / h) * 100 : 0) + "%";
      }
      updateJourney();
      ticking = false;
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });

  /* ---------------- Reveal on scroll ---------------- */
  var revealables = document.querySelectorAll("[data-reveal]");
  if ("IntersectionObserver" in window && !reduced) {
    var ro = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("in"); ro.unobserve(en.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    revealables.forEach(function (el) { ro.observe(el); });
  } else {
    revealables.forEach(function (el) { el.classList.add("in"); });
  }

  /* ---------------- Gate in-view animations ---------------- */
  var holders = document.querySelectorAll(".bars, .donutwrap, .linechart, .ai-pbody, .ai-foot, .illo, .dash-view");
  if ("IntersectionObserver" in window && !reduced) {
    holders.forEach(function (el) { el.classList.add("hold"); });
    var ho = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("play"); ho.unobserve(en.target); }
      });
    }, { threshold: 0.15 });
    holders.forEach(function (el) { ho.observe(el); });
  }

  /* ---------------- Count-up ---------------- */
  function fmt(n) { return n.toLocaleString("en-US"); }
  function countUp(el) {
    var target = parseFloat(el.getAttribute("data-count")) || 0;
    var dur = parseFloat(el.getAttribute("data-dur")) || 1400;
    var pre = el.getAttribute("data-prefix") || "";
    var suf = el.getAttribute("data-suffix") || "";
    if (reduced) { el.textContent = pre + fmt(target) + suf; return; }
    var start = null;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 4);
      el.textContent = pre + fmt(Math.round(target * eased)) + suf;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var counters = document.querySelectorAll("[data-count]");
  if ("IntersectionObserver" in window) {
    var co = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { countUp(en.target); co.unobserve(en.target); }
      });
    }, { threshold: 0.4 });
    counters.forEach(function (el) { co.observe(el); });
  } else {
    counters.forEach(countUp);
  }

  /* ---------------- Hero parallax + tilt ---------------- */
  var heroApp = document.getElementById("heroApp");
  var auroras = document.querySelectorAll(".aurora[data-par]");
  if (!reduced && window.matchMedia("(pointer: fine)").matches) {
    var mx = 0, my = 0, tx = 0, ty = 0, raf = null;
    function loop() {
      tx += (mx - tx) * 0.07;
      ty += (my - ty) * 0.07;
      auroras.forEach(function (a) {
        var f = parseFloat(a.getAttribute("data-par")) || 0;
        a.style.marginLeft = (tx * f * 70) + "px";
        a.style.marginTop = (ty * f * 70) + "px";
      });
      if (heroApp) {
        heroApp.style.setProperty("--ry", (-6 + tx * 5).toFixed(2) + "deg");
        heroApp.style.setProperty("--rx", (3 - ty * 4).toFixed(2) + "deg");
      }
      raf = (Math.abs(mx - tx) > 0.001 || Math.abs(my - ty) > 0.001) ? requestAnimationFrame(loop) : null;
    }
    window.addEventListener("mousemove", function (e) {
      mx = (e.clientX / window.innerWidth) * 2 - 1;
      my = (e.clientY / window.innerHeight) * 2 - 1;
      if (!raf) raf = requestAnimationFrame(loop);
    }, { passive: true });
  }

  /* ---------------- Card pointer glow ---------------- */
  if (!reduced) {
    document.querySelectorAll(".card").forEach(function (card) {
      card.addEventListener("pointermove", function (e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty("--mx", (e.clientX - r.left) + "px");
        card.style.setProperty("--my", (e.clientY - r.top) + "px");
      });
    });
  }

  /* ---------------- Product tabs ---------------- */
  var tabbar = document.getElementById("tabbar");
  if (tabbar) {
    var tabs = Array.prototype.slice.call(tabbar.querySelectorAll("[role=tab]"));
    var glider = tabbar.querySelector(".glider");

    function moveGlider(btn) {
      if (!glider || !btn) return;
      glider.style.width = btn.offsetWidth + "px";
      glider.style.transform = "translateX(" + (btn.offsetLeft - 6) + "px)";
    }
    function selectTab(btn, focus) {
      tabs.forEach(function (t) {
        var on = t === btn;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
        var panel = document.getElementById(t.getAttribute("aria-controls"));
        if (panel) {
          if (on) { panel.setAttribute("data-active", ""); panel.removeAttribute("hidden"); }
          else { panel.removeAttribute("data-active"); panel.setAttribute("hidden", ""); }
        }
      });
      moveGlider(btn);
      if (focus) btn.focus();
    }
    tabs.forEach(function (t, i) {
      t.tabIndex = t.getAttribute("aria-selected") === "true" ? 0 : -1;
      t.addEventListener("click", function () { selectTab(t); });
      t.addEventListener("keydown", function (e) {
        var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        selectTab(tabs[(i + d + tabs.length) % tabs.length], true);
      });
    });
    function syncGlider() {
      moveGlider(tabbar.querySelector('[aria-selected="true"]'));
    }
    requestAnimationFrame(syncGlider);
    window.addEventListener("load", syncGlider);
    window.addEventListener("resize", syncGlider, { passive: true });
    // The section sits far below the fold; measure once it is actually laid out on screen.
    if ("IntersectionObserver" in window) {
      var glObs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { syncGlider(); } });
      }, { threshold: 0.1 });
      glObs.observe(tabbar);
    }
  }

  /* ---------------- Dashboard views ---------------- */
  var dashBtns = document.querySelectorAll(".dash-tabs button[data-view]");
  var dashViews = document.querySelectorAll(".dash-view[data-view]");
  dashBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-view");
      dashBtns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      dashViews.forEach(function (view) {
        if (view.getAttribute("data-view") === v) {
          view.setAttribute("data-on", "");
          view.classList.add("play");
        } else {
          view.removeAttribute("data-on");
        }
      });
    });
  });

  /* ---------------- Journey progress ---------------- */
  var jline = document.getElementById("jline");
  var jsteps = document.querySelectorAll(".jstep");
  function updateJourney() {
    if (!jline || !jsteps.length) return;
    var journey = document.getElementById("journey");
    var r = journey.getBoundingClientRect();
    var anchor = window.innerHeight * 0.58;
    var p = (anchor - r.top) / r.height;
    p = Math.max(0, Math.min(1, p));
    jline.style.setProperty("--p", p.toFixed(3));
    jsteps.forEach(function (s) {
      var sr = s.getBoundingClientRect();
      s.classList.toggle("on", sr.top < anchor && sr.bottom > 0);
    });
  }
  updateJourney();

  /* ---------------- FAQ accordion ---------------- */
  document.querySelectorAll(".qa > button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var qa = btn.parentElement;
      var open = qa.hasAttribute("data-open");
      qa.parentElement.querySelectorAll(".qa[data-open]").forEach(function (o) {
        o.removeAttribute("data-open");
        var b = o.querySelector("button");
        if (b) b.setAttribute("aria-expanded", "false");
      });
      if (!open) { qa.setAttribute("data-open", ""); btn.setAttribute("aria-expanded", "true"); }
    });
  });

  /* ---------------- Active nav link ---------------- */
  var sections = document.querySelectorAll("section[id]");
  var linkFor = {};
  document.querySelectorAll(".nav-links a[href^='#']").forEach(function (a) {
    linkFor[a.getAttribute("href").slice(1)] = a;
  });
  if ("IntersectionObserver" in window) {
    var so = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var a = linkFor[en.target.id];
        if (!a) return;
        if (en.isIntersecting) {
          Object.keys(linkFor).forEach(function (k) { linkFor[k].style.color = ""; });
          a.style.color = "var(--text)";
        }
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    sections.forEach(function (s) { so.observe(s); });
  }

  onScroll();
})();

/* ---------- Start-your-return chooser ---------- */
(function () {
  // FilePak self-serve app is built but not yet open to the public -- show it as "coming soon".
  // Flip APP_LIVE to true when it is ready; the browser row then becomes a live link to APP.
  var APP_LIVE = true;
  var APP = "https://app.big1.com.pk";
  var WA = "https://wa.me/923399999611?text=I%20want%20to%20file%20my%20tax%20return.";
  // Fees come from the FilePak rate card: baked at build into window.BIG1_FEES, refreshed live from the API.
  function feeTxt(kind){ var f=(window.BIG1_FEES&&window.BIG1_FEES.fees)||{}; var v=f[kind]; return v?Number(v).toLocaleString('en-PK'):'?'; }
  function feeSpan(kind){ return '<span data-fee="'+kind+'">'+feeTxt(kind)+'</span>'; }
  (function refreshFees(){
    try{
      fetch(APP+'/api/v1/pricing',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
        if(!d||!d.fees) return;
        window.BIG1_FEES={currency:d.currency||'PKR',fees:d.fees};
        var els=document.querySelectorAll('[data-fee]');
        for(var i=0;i<els.length;i++){ var t=feeTxt(els[i].getAttribute('data-fee')); if(t!=='?') els[i].textContent=t; }
      }).catch(function(){});
    }catch(e){}
  })();
  var arw = '<span class="so-arw"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg></span>';
  var globe = '<span class="so-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.6 3.5 6 3.5 9s-1.1 6.4-3.5 9c-2.4-2.6-3.5-6-3.5-9s1.1-6.4 3.5-9z"/></svg></span>';
  var waRow =
    '<a class="startm-opt is-live" href="' + WA + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="startm-badge">Available now</span>' +
      '<span class="so-ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.86 9.86 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2z"/></svg></span>' +
      '<span class="so-t"><b>File with our team on WhatsApp</b><span>We prepare and file it for you</span></span>' + arw +
    '</a>';
  // ONE chooser for every "start" button on the site -- the same two ways the app offers.
  // Both deep-link into the app on the chosen way (the app asks for sign-in + profile first).
  var selfRow =
    '<a class="startm-opt" href="' + APP + '/?service=self_filing" target="_blank" rel="noopener noreferrer">' +
      globe + '<span class="so-t"><b>Self-Filing &middot; Rs ' + feeSpan('income_tax_return') + '</b><span>You prepare it yourself, step by step.</span></span>' + arw +

/* ---------- Rotating home hero ---------- */
(function () {
  var hero = document.querySelector('.rhero');
  if (!hero) return;
  document.documentElement.classList.add('has-hero');
  var slides = hero.querySelectorAll('.rslide'),
      texts = hero.querySelectorAll('.rtext'),
      dots = hero.querySelectorAll('.rdot');
  var n = slides.length, cur = 0;
  var cta = document.getElementById('rheroCta');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function syncCta(t) {
    if (!cta || !t) return;
    var label = t.getAttribute('data-cta'), href = t.getAttribute('data-href');
    if (label) {
      cta.innerHTML = label + ' <svg class="arw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>';
    }
    if (href) cta.setAttribute('href', href);
    if (t.getAttribute('data-start') === '1') { cta.setAttribute('data-start', ''); }
    else { cta.removeAttribute('data-start'); }
  }
  function go(i) {
    i = (i + n) % n;
    if (i === cur) return;
    slides[cur].classList.remove('on'); texts[cur].classList.remove('on'); dots[cur].classList.remove('on');
    cur = i;
    slides[cur].classList.add('on'); texts[cur].classList.add('on'); dots[cur].classList.add('on');
    syncCta(texts[cur]);
  }
  for (var d = 0; d < dots.length; d++) {
    (function (k) { dots[k].addEventListener('click', function () { go(k); }); })(d);
  }
  var held = false;
  hero.addEventListener('pointerenter', function () { held = true; }, { passive: true });
  hero.addEventListener('pointerleave', function () { held = false; }, { passive: true });
  if (!reduce) { setInterval(function () { if (!held) go(cur + 1); }, 4500); }

  /* ---- hero canvas: a light the visitor moves ---------------------------------------
     A few large emerald blooms drift behind the headline, and one brighter bloom trails
     the pointer, so moving across the hero feels like moving a light over the surface.

     An earlier version drew small hard-edged bars here. Over a photograph they read as
     redaction marks rather than design, which is why this is soft and large instead.

     Cheap by construction: everything is drawn into a ~200px offscreen buffer and scaled
     up, so the browser's own smoothing supplies the blur. Six radial gradients a frame. */
  (function () {
    var cv = document.getElementById('heroCanvas');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    if (!ctx) return;

    var slide = cv.parentNode;
    var buf = document.createElement('canvas'), bx = buf.getContext('2d');
    if (!bx) return;

    var W = 0, H = 0, BW = 0, BH = 0, blobs = [], t0 = 0, raf = 0, running = false;
    var pxr = 0.5, pyr = 0.5, tgx = 0.5, tgy = 0.5, glow = 0, tglow = 0;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

    function rand(a, b) { return a + Math.random() * (b - a); }

    function build() {
      var r = slide.getBoundingClientRect();
      if (!r.width || !r.height) return false;
      W = r.width; H = r.height;
      // the visible canvas stays at CSS size: it only ever draws one upscaled image
      cv.width = Math.round(W); cv.height = Math.round(H);
      BW = 200; BH = Math.max(80, Math.round(200 * H / W));
      buf.width = BW; buf.height = BH;
      blobs = [
        { x: .68, y: .28, r: .30, c: '16,185,129', a: .95, sx: .045, sy: .030, p: 0 },
        { x: .86, y: .60, r: .24, c: '45,212,191', a: .80, sx: .034, sy: .046, p: 1.7 },
        { x: .55, y: .78, r: .28, c: '5,150,105',  a: .78, sx: .040, sy: .026, p: 3.1 },
        { x: .95, y: .16, r: .18, c: '167,243,208',a: .60, sx: .028, sy: .038, p: 4.6 },
        { x: .44, y: .16, r: .20, c: '13,110,90',  a: .62, sx: .036, sy: .032, p: 5.9 }
      ];
      return true;
    }

    function blob(cx, cy, rad, rgb, alpha) {
      if (alpha <= 0.002 || rad <= 0) return;
      var g = bx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, 'rgba(' + rgb + ',' + alpha.toFixed(3) + ')');
      g.addColorStop(0.45, 'rgba(' + rgb + ',' + (alpha * 0.42).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + rgb + ',0)');
      bx.fillStyle = g;
      bx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    }

    function paint(el) {
      bx.clearRect(0, 0, BW, BH);
      bx.globalCompositeOperation = 'lighter';   // overlaps bloom instead of muddying
      for (var i = 0; i < blobs.length; i++) {
        var b = blobs[i];
        // each drifts on its own slow lissajous, so the field never visibly repeats
        var cx = (b.x + Math.cos(el * b.sx + b.p) * 0.06) * BW;
        var cy = (b.y + Math.sin(el * b.sy + b.p * 1.3) * 0.05) * BH;
        var breathe = 1 + Math.sin(el * 0.22 + b.p) * 0.07;
        blob(cx, cy, b.r * BW * breathe, b.c, b.a);
      }
      if (glow > 0.004) {
        // the pointer's own light: brighter, tighter, and it trails rather than snaps
        blob(pxr * BW, pyr * BH, 0.30 * BW, '134,239,172', 0.5 * glow);
        blob(pxr * BW, pyr * BH, 0.13 * BW, '209,250,229', 0.34 * glow);
      }
      bx.globalCompositeOperation = 'source-over';

      ctx.clearRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = true;          // this is the blur
      if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(buf, 0, 0, W, H);
    }

    function frame(now) {
      raf = 0;
      if (!running) return;
      if (!t0) t0 = now;
      var el = (now - t0) / 1000;
      pxr += (tgx - pxr) * 0.07;                 // the light lags the cursor: it feels heavy
      pyr += (tgy - pyr) * 0.07;
      glow += (tglow - glow) * 0.05;
      paint(el);
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (running || !blobs.length) return;
      running = true; t0 = 0;
      cv.classList.add('on');
      if (reduce) { paint(0); return; }          // one still frame, no loop
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      running = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
    }

    if (!reduce) {
      hero.addEventListener('pointermove', function (e) {
        var r = cv.getBoundingClientRect();
        tgx = (e.clientX - r.left) / r.width;
        tgy = (e.clientY - r.top) / r.height;
        tglow = 1;
      }, { passive: true });
      hero.addEventListener('pointerleave', function () { tglow = 0; }, { passive: true });
    }

    if (!build()) return;

    if (window.MutationObserver) {
      new MutationObserver(function () {
        if (slide.classList.contains('on') && !document.hidden) { start(); }
        else { stop(); cv.classList.remove('on'); }
      }).observe(slide, { attributes: true, attributeFilter: ['class'] });
    }
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting && slide.classList.contains('on')) { start(); } else { stop(); }
      }, { threshold: 0.05 }).observe(hero);
    }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stop(); } else if (slide.classList.contains('on')) { start(); }
    });
    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { if (build() && reduce) paint(0); }, 200);
    });

    if (slide.classList.contains('on')) { start(); }
  })();



})();

/* ---------- Services rail (home) ----------
   The track is a real scroll container, so swipe, trackpad and keyboard already work and
   this only adds the arrows, the dots and the disabled states. Everything reads position
   from scrollLeft rather than keeping its own index, so dragging by hand stays in sync. */
(function () {
  var track = document.getElementById('svcTrack');
  if (!track) return;
  var panels = track.querySelectorAll('.svc-panel');
  var prev = document.querySelector('.svc-prev'),
      next = document.querySelector('.svc-next'),
      dotWrap = document.getElementById('svcDots');
  if (!panels.length) return;

  for (var i = 0; i < panels.length; i++) {
    (function (k) {
      var b = document.createElement('button');
      b.className = 'svc-dot' + (k === 0 ? ' on' : '');
      b.type = 'button';
      b.setAttribute('aria-label', 'Go to service ' + (k + 1));
      b.addEventListener('click', function () { scrollTo(k); });
      dotWrap.appendChild(b);
    })(i);
  }
  var dots = dotWrap.querySelectorAll('.svc-dot');

  function step() {
    // panel width + the gap between panels
    var a = panels[0].getBoundingClientRect();
    if (panels.length < 2) return a.width;
    return panels[1].getBoundingClientRect().left - a.left;
  }
  function current() {
    var st = step();
    return st ? Math.round(track.scrollLeft / st) : 0;
  }
  function scrollTo(i) {
    i = Math.max(0, Math.min(panels.length - 1, i));
    track.scrollTo({ left: i * step(), behavior: 'smooth' });
  }
  function sync() {
    var i = current(),
        max = track.scrollWidth - track.clientWidth - 2;
    if (prev) prev.disabled = track.scrollLeft <= 2;
    if (next) next.disabled = track.scrollLeft >= max;
    for (var k = 0; k < dots.length; k++) { dots[k].classList.toggle('on', k === i); }
  }
  if (prev) prev.addEventListener('click', function () { scrollTo(current() - 1); });
  if (next) next.addEventListener('click', function () { scrollTo(current() + 1); });

  var tick;
  track.addEventListener('scroll', function () {
    if (tick) return;                       // one sync per frame, not one per scroll event
    tick = requestAnimationFrame(function () { tick = 0; sync(); });
  }, { passive: true });
  window.addEventListener('resize', sync);
  sync();
})();

/* ---------- Nav mega-menu ----------
   Opens on hover and on keyboard focus; closes on Escape, on click-through, and when the
   pointer leaves both the trigger and the panel. The small close delay is what stops the
   menu flickering shut while the pointer crosses the gap between the two. */
(function () {
  var triggers = document.querySelectorAll('[data-mega-for]');
  if (!triggers.length) return;
  if (window.matchMedia && !window.matchMedia('(min-width: 901px)').matches) return;
  if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;  // touch: no hover to leave

  var open = null, timer = null;

  function show(key, trigger) {
    clearTimeout(timer);
    if (open && open.key === key) return;
    hide(true);
    var panel = document.getElementById('mega-' + key);
    if (!panel) return;
    panel.classList.add('open');
    trigger.classList.add('mega-on');
    trigger.setAttribute('aria-expanded', 'true');
    open = { key: key, panel: panel, trigger: trigger };
  }
  function hide(now) {
    clearTimeout(timer);
    if (!open) return;
    var o = open;
    var done = function () {
      o.panel.classList.remove('open');
      o.trigger.classList.remove('mega-on');
      o.trigger.setAttribute('aria-expanded', 'false');
      if (open === o) open = null;
    };
    if (now) { done(); } else { timer = setTimeout(done, 180); }
  }

  for (var i = 0; i < triggers.length; i++) {
    (function (t) {
      var key = t.getAttribute('data-mega-for');
      t.addEventListener('mouseenter', function () { show(key, t); });
      t.addEventListener('focus', function () { show(key, t); });
      t.addEventListener('mouseleave', function () { hide(); });
      // clicking the nav item still navigates: the panel is a shortcut, not a gate
      t.addEventListener('click', function () { hide(true); });
      var panel = document.getElementById('mega-' + key);
      if (panel) {
        panel.addEventListener('mouseenter', function () { clearTimeout(timer); });
        panel.addEventListener('mouseleave', function () { hide(); });
        panel.addEventListener('click', function (e) { if (e.target.closest('a')) hide(true); });
      }
    })(triggers[i]);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && open) { var t = open.trigger; hide(true); t.focus(); }
  });
  // focus moving anywhere outside the open panel and its trigger closes it
  document.addEventListener('focusin', function (e) {
    if (!open) return;
    if (open.panel.contains(e.target) || e.target === open.trigger) return;
    hide(true);
  });
  window.addEventListener('scroll', function () { if (open) hide(true); }, { passive: true });
})();

/* ---------- Cookie consent ---------- */
(function () {
  var KEY = "big1_cookie_consent";  // stored value: "all" | "necessary"
  // Runs only after the visitor accepts analytics. Drop your analytics
  // snippet (e.g. Plausible / Google Analytics) inside this function.
  function enableAnalytics() {
    if (window.__big1Analytics) return; window.__big1Analytics = true;
    /* e.g. var s=document.createElement('script'); s.src='...'; document.head.appendChild(s); */
  }
  function apply(choice) { if (choice === "all") enableAnalytics(); }

  var html =
    '<div class="cookie" id="cookieBar" role="dialog" aria-label="Cookie consent" hidden>' +
      '<div class="cookie-in">' +
        '<div class="cookie-tx">' +
          '<b>Cookies</b>' +
          '<p>We use essential cookies to make this site work. With your consent we&rsquo;d also use analytics ' +
          'to understand what&rsquo;s useful and improve it. See our <a href="about.html#contact">privacy note</a>.</p>' +
        '</div>' +
        '<div class="cookie-btns">' +
          '<button class="cookie-btn ghost" type="button" data-cc="necessary">Necessary only</button>' +
          '<button class="cookie-btn primary" type="button" data-cc="all">Accept all</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML("beforeend", html);
  var bar = document.getElementById("cookieBar");

  function choose(v) { try { localStorage.setItem(KEY, v); } catch (e) {} apply(v); if (bar) bar.hidden = true; }
  function open() { if (bar) bar.hidden = false; }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { apply(saved); } else { open(); }

  if (bar) {
    var btns = bar.querySelectorAll("[data-cc]");
    for (var i = 0; i < btns.length; i++) {
      (function (b) { b.addEventListener("click", function () { choose(b.getAttribute("data-cc")); }); })(btns[i]);
    }
  }
  // Footer "Cookie preferences" link reopens the banner.
  var reopen = document.querySelectorAll("[data-cookie-open]");
  for (var j = 0; j < reopen.length; j++) {
    reopen[j].addEventListener("click", function (e) { e.preventDefault(); open(); });
  }
})();
