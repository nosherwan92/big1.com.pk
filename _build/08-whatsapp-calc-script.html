<script>
/* ============================================================
   FilePak - free tax calculators
   Tax year 2026 (Finance Act 2025).
   Rates verified against PwC Worldwide Tax Summaries - Pakistan.
   Salaried slabs, non-salaried slabs, surcharge thresholds,
   s.37 property CGT (incl. pre-Jul-2024 taper) and s.37A securities.
   ============================================================ */
(function () {
  "use strict";

  /* ---------- Rate tables ---------- */
  var SAL_SLABS = [
    { lo: 0,         fx: 0,       r: 0.00 },
    { lo: 600000,    fx: 0,       r: 0.01 },
    { lo: 1200000,   fx: 6000,    r: 0.11 },
    { lo: 2200000,   fx: 116000,  r: 0.23 },
    { lo: 3200000,   fx: 346000,  r: 0.30 },
    { lo: 4100000,   fx: 616000,  r: 0.35 }
  ];
  var NONSAL_SLABS = [
    { lo: 0,         fx: 0,       r: 0.00 },
    { lo: 600000,    fx: 0,       r: 0.15 },
    { lo: 1200000,   fx: 90000,   r: 0.20 },
    { lo: 1600000,   fx: 170000,  r: 0.30 },
    { lo: 3200000,   fx: 650000,  r: 0.40 },
    { lo: 5600000,   fx: 1610000, r: 0.45 }
  ];
  var SURCHARGE_FROM = 10000000;
  var SUR_SAL = 0.09, SUR_NONSAL = 0.10;

  /* s.37 - immovable property acquired on/before 30 Jun 2024.
     Index = completed years held, capped at 6. */
  var CGT_PROP_TAPER = {
    plot:  [0.15, 0.125, 0.10, 0.075, 0.05, 0.025, 0],
    built: [0.15, 0.10,  0.075, 0.05, 0,    0,     0],
    flat:  [0.15, 0.075, 0,     0,    0,    0,     0]
  };
  /* s.37A - securities acquired before 1 Jul 2024 */
  var CGT_SEC_TAPER = [0.15, 0.125, 0.10, 0.075, 0.05, 0.025, 0];

  /* ---------- Helpers ---------- */
  function num(id) {
    var el = document.getElementById(id);
    if (!el) return 0;
    var v = parseFloat(el.value);
    return isFinite(v) && v > 0 ? v : 0;
  }
  function money(n) {
    return "Rs " + Math.round(n).toLocaleString("en-US");
  }
  function plain(n) {
    return Math.round(n).toLocaleString("en-US");
  }
  function pct(n) {
    var s = (n * 100).toFixed(2);
    if (s.indexOf(".") > -1) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s + "%";
  }
  function set(id, txt) {
    var el = document.getElementById(id);
    if (el) el.textContent = txt;
  }
  function html(id, markup) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = markup;
  }
  function segValue(groupId, attr, fallback) {
    var g = document.getElementById(groupId);
    if (!g) return fallback;
    var on = g.querySelector('[aria-pressed="true"]');
    return on ? on.getAttribute(attr) : fallback;
  }

  /* Progressive slab tax. Returns {tax, band, rate, lo}. */
  function slabTax(income, slabs) {
    if (income <= 0) return { tax: 0, band: 0, rate: 0, lo: 0 };
    var b = slabs[0], i = 0;
    for (var k = 0; k < slabs.length; k++) {
      if (income > slabs[k].lo) { b = slabs[k]; i = k; } else break;
    }
    return { tax: b.fx + b.r * (income - b.lo), band: i, rate: b.r, lo: b.lo };
  }


  /* ---------- Salary ---------- */
  function calcSalary() {
    var per = parseFloat(segValue("sal_period", "data-per", "12")) || 12;
    var gross = num("sal_amt") * per;
    var exempt = num("sal_exempt");
    var paid = num("sal_wht");

    var taxable = Math.max(0, gross - exempt);
    var s = slabTax(taxable, SAL_SLABS);
    var sur = taxable > SURCHARGE_FROM ? s.tax * SUR_SAL : 0;
    var total = s.tax + sur;
    var eff = gross > 0 ? total / gross : 0;

    set("sal_tax", money(total));
    set("sal_month", money(total / 12) + " per month");
    set("sal_taxable", plain(taxable));
    set("sal_base", plain(s.tax));
    set("sal_sur", plain(sur));
    set("sal_total", plain(total));
    set("sal_net", plain(Math.max(0, (gross - total) / 12)));
    set("sal_eff", pct(eff));

    var fixedPart = s.tax - s.rate * (taxable - s.lo);
    html("sal_trace", taxable <= 600000
      ? "Income up to <code>Rs 600,000</code> is exempt - no tax due."
      : "Band: <code>" + pct(s.rate) + "</code> - Rs " + plain(fixedPart) +
        " fixed plus " + pct(s.rate) + " of the amount above Rs " + plain(s.lo) + "." +
        (sur > 0 ? " A 9% surcharge applies because taxable income exceeds Rs 10,000,000." : ""));

    if (paid > 0) {
      var diff = paid - total;
      html("sal_recon", diff > 1
        ? '<div class="calc-note" style="background:rgba(16,185,129,.09);border-color:rgba(16,185,129,.3)">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--emerald-600)"><path d="M20 6 9 17l-5-5"/></svg>' +
          '<span>Your employer has deducted <b>' + money(diff) + ' more</b> than the slabs require. That is a refund you can claim.</span></div>'
        : diff < -1
        ? '<div class="calc-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/></svg>' +
          '<span>Deducted <b>' + money(-diff) + ' less</b> than the slabs require. The shortfall is payable with your return.</span></div>'
        : '');
    } else {
      html("sal_recon", "");
    }
  }

  /* ---------- Rental / property ---------- */
  function calcProperty() {
    var rent = num("pr_rent");
    var claimRep = segValue("pr_rep", "data-rep", "1") === "1";
    var rep = claimRep ? rent / 5 : 0;
    var other = num("pr_other");
    var netProp = Math.max(0, rent - rep - other);
    var oi = num("pr_salary");
    var totalInc = netProp + oi;

    var salaried = segValue("pr_mode", "data-sal", "0") === "1";
    var slabs = salaried ? SAL_SLABS : NONSAL_SLABS;
    var s = slabTax(totalInc, slabs);
    var sur = totalInc > SURCHARGE_FROM ? s.tax * (salaried ? SUR_SAL : SUR_NONSAL) : 0;
    var total = s.tax + sur;

    set("pr_tax", money(total));
    set("pr_sub", (salaried ? "Salaried" : "Non-salaried") + " slab rates - band " + pct(s.rate));
    set("pr_g", plain(rent));
    set("pr_r", plain(rep));
    set("pr_o", plain(other));
    set("pr_net", plain(netProp));
    set("pr_oi", plain(oi));
    set("pr_tt", plain(totalInc));
    set("pr_eff", pct(totalInc > 0 ? total / totalInc : 0));
  }

  /* ---------- CGT - immovable property ---------- */
  function calcCgtProp() {
    var sale = num("cp_sale"), cost = num("cp_cost");
    var gain = Math.max(0, sale - cost);
    var era = segValue("cp_era", "data-era", "new");
    var atl = segValue("cp_atl", "data-atl", "1") === "1";

    var oldWrap = document.getElementById("cp_oldwrap");
    var holdWrap = document.getElementById("cp_holdwrap");
    if (oldWrap) oldWrap.hidden = era !== "old";
    if (holdWrap) holdWrap.hidden = era !== "old";

    var rate = 0, label = "";
    if (era === "new") {
      if (atl) {
        rate = 0.15;
        label = "Flat 15% - acquired on or after 1 July 2024, on the Active Taxpayers List.";
      } else {
        var sl = slabTax(gain, NONSAL_SLABS);
        var implied = gain > 0 ? sl.tax / gain : 0;
        rate = Math.max(0.15, implied);
        label = "Slab rates apply, but not less than 15% - you are not on the Active Taxpayers List.";
      }
    } else {
      var type = (document.getElementById("cp_type") || {}).value || "plot";
      var hold = Math.max(0, Math.min(6, Math.floor(num("cp_hold"))));
      rate = CGT_PROP_TAPER[type][hold];
      var typeName = type === "plot" ? "open plot" : type === "built" ? "constructed property" : "flat";
      label = rate === 0
        ? "Held long enough - the gain on a " + typeName + " is not taxable at this holding period."
        : pct(rate) + " - " + typeName + " acquired on or before 30 June 2024, held " +
          (hold === 0 ? "under a year" : hold + (hold === 1 ? " year" : " years")) + ".";
    }

    var tax = gain * rate;
    set("cp_tax", money(tax));
    set("cp_rate", label);
    set("cp_s", plain(sale));
    set("cp_c", plain(cost));
    set("cp_gain", plain(gain));
    set("cp_r2", pct(rate));
    set("cp_t2", plain(tax));
  }

  /* ---------- CGT - securities ---------- */
  function calcCgtSec() {
    var proceeds = num("cs_proceeds"), cost = num("cs_cost");
    var gain = Math.max(0, proceeds - cost);
    var era = segValue("cs_era", "data-era", "new");
    var atl = segValue("cs_atl", "data-atl", "1") === "1";

    var rate = 0, label = "";
    if (era === "new") {
      if (atl) {
        rate = 0.15;
        label = "Flat 15% - acquired on or after 1 July 2024, on the Active Taxpayers List.";
      } else {
        var sl = slabTax(gain, NONSAL_SLABS);
        rate = Math.max(0.15, gain > 0 ? sl.tax / gain : 0);
        label = "Slab rates apply, but not less than 15% - not on the Active Taxpayers List.";
      }
    } else {
      rate = CGT_SEC_TAPER[0];
      label = "Showing the top rate of 15%. Securities acquired before 1 July 2024 follow a " +
              "holding-period taper that can reduce this to nil - your actual rate depends on the " +
              "acquisition date, so treat this as a ceiling, not a quote.";
    }

    var tax = gain * rate;
    set("cs_tax", money(tax));
    set("cs_rate", label);
    set("cs_p", plain(proceeds));
    set("cs_c", plain(cost));
    set("cs_gain", plain(gain));
    set("cs_r2", pct(rate));
    set("cs_t2", plain(tax));
  }

  /* ---------- Business / freelance ---------- */
  function calcBusiness() {
    var rev = num("bz_rev"), exp = num("bz_exp"), paid = num("bz_wht");
    var net = Math.max(0, rev - exp);
    var s = slabTax(net, NONSAL_SLABS);
    var sur = net > SURCHARGE_FROM ? s.tax * SUR_NONSAL : 0;
    var total = s.tax + sur;

    set("bz_tax", money(total));
    var diff = paid - total;
    set("bz_sub", paid > 0
      ? (diff > 1 ? money(diff) + " refundable" : diff < -1 ? money(-diff) + " still payable" : "Fully settled")
      : "Non-salaried individual / AOP rates");
    set("bz_r", plain(rev));
    set("bz_e", plain(exp));
    set("bz_np", plain(net));
    set("bz_base", plain(s.tax));
    set("bz_sur", plain(sur));
    set("bz_total", plain(total));
    set("bz_eff", pct(rev > 0 ? total / rev : 0));

    var fixedPart = s.tax - s.rate * (net - s.lo);
    html("bz_trace", net <= 600000
      ? "Net profit up to <code>Rs 600,000</code> is below the taxable threshold."
      : "Band: <code>" + pct(s.rate) + "</code> - Rs " + plain(fixedPart) +
        " fixed plus " + pct(s.rate) + " of the amount above Rs " + plain(s.lo) + "." +
        (sur > 0 ? " A 10% surcharge applies above Rs 10,000,000." : ""));
  }

  function recalcAll() {
    calcSalary(); calcProperty(); calcCgtProp(); calcCgtSec(); calcBusiness();
  }

  /* ---------- Wiring ---------- */
  var pick = document.getElementById("calcPick");
  var views = document.querySelectorAll(".calc-view[data-calc]");
  if (pick) {
    pick.querySelectorAll(".cpick").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var which = btn.getAttribute("data-calc");
        pick.querySelectorAll(".cpick").forEach(function (o) {
          o.setAttribute("aria-pressed", String(o === btn));
        });
        views.forEach(function (v) {
          if (v.getAttribute("data-calc") === which) v.setAttribute("data-on", "");
          else v.removeAttribute("data-on");
        });
        var body = document.getElementById("calcBody");
        if (body && Math.abs(body.getBoundingClientRect().top) > window.innerHeight) {
          body.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
    });
  }

  /* segmented toggles */
  document.querySelectorAll(".calc-body .seg").forEach(function (g) {
    g.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        g.querySelectorAll("button").forEach(function (o) {
          o.setAttribute("aria-pressed", String(o === b));
        });
        recalcAll();
      });
    });
  });

  /* live inputs */
  document.querySelectorAll(".calc-body input, .calc-body select").forEach(function (el) {
    el.addEventListener("input", recalcAll);
    el.addEventListener("change", recalcAll);
  });

  recalcAll();
})();
</script>
